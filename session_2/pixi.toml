[workspace]
name = "multi-agent-turtlesim"
version = "0.1.0"
channels = ["https://prefix.dev/robostack-humble", "https://prefix.dev/conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = "3.11.*"
ros-humble-ros-core = "*"
ros-humble-turtlesim = "*"
ros-humble-std-srvs = "*"
ros-humble-geometry-msgs = "*"
ros-humble-rclpy = "*"

[pypi-dependencies]
langchain = ">=0.3.0"
langchain-google-genai = ">=2.0.0"
langchain-openai = ">=0.3.0"
langchain-anthropic = ">=0.3.0"
langchain-ollama = ">=0.3.0"
langgraph = ">=0.2.0"
pydantic = ">=2.0"
python-dotenv = ">=1.0"
pillow = ">=10.0"

[tasks]
sim = "ros2 run turtlesim turtlesim_node"
teleop = "ros2 run turtlesim turtle_teleop_key"
agents = { cmd = "python -m src.main", env = { PYTHONPATH = "." } }
draw = { cmd = "python -m src.main --request \"Draw a blue square with side length 2.\"", env = { PYTHONPATH = "." } }
graph = { cmd = "python -m src.visualize_graph", env = { PYTHONPATH = "." } }
